name: Run Dice Game

on:
  push:
    branches: [ main ]
  workflow_dispatch: # This gives you a "Run workflow" button!

jobs:
  run-dice:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run the dice game
        run: python dice.py
