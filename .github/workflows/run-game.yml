name: Run Dice Game

on:
  push:
    branches: [ main, v3, v4 ]
  pull_request:
    branches: [ main, v3, v4 ]
  workflow_dispatch: # This gives you a "Run workflow" button!

jobs:
  run-dice:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run the dice game
        run: python dice.py < /dev/null
        env:
          PYTHONUNBUFFERED: "1"
